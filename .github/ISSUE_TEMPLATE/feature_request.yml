name: 개선 제안
description: 더 편하게 쓰기 위한 기능이나 개선점을 제안해 주세요.
title: "[제안] "
body:
  - type: dropdown
    id: product
    attributes:
      label: 관련 제품
      options:
        - 클래식 패드
        - 월티 허브
        - 두 제품 모두
        - 공통 설치·설정·문서
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 어떤 점이 불편한가요?
      description: 사용 중인 상황을 함께 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 어떻게 바뀌면 좋을까요?
      description: 원하는 동작이나 예시를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 참고할 내용
      description: 다른 방법이나 관련 화면·자료가 있다면 함께 남겨 주세요.
