name: 검증

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "release/2.0.0"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  hacs:
    name: HACS 공개 저장소 검사
    # HACS requires a public repository; hassfest and lint also run for private repositories.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS 저장소 검사
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: HA 통합구성요소 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  lint:
    name: 코드 스타일 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
